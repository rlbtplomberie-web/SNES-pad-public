name: Build SNES Pad V10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-snes-pad-v10.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get official Snes9x EX Plus 1.5.81 source
        run: |
          git checkout 1dea415 -- v2/snes-pad-v2-assets.zip
          test -f "$GITHUB_WORKSPACE/v6/snes-pad-v6.patch"
          mkdir -p /tmp/snes-v2-assets
          unzip -q "$GITHUB_WORKSPACE/v2/snes-pad-v2-assets.zip" -d /tmp/snes-v2-assets
          git clone https://github.com/Rakashazi/emu-ex-plus-alpha.git source
          cd source
          git checkout 12f8a0c48815e01a06bc94a4496eabfde6f45b52
          git apply "$GITHUB_WORKSPACE/v6/snes-pad-v6.patch"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  print(f'Bloc deja modifie ou absent dans {path}: {text.count(old)}; poursuite de la construction')
                  return False
              file.write_text(text.replace(old, new))
              return True

          def replace_optional(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  print(f'Sauvegarde renforcee dans {path}')
              else:
                  print(f'Bloc facultatif deja different dans {path}; sauvegarde standard conservee')

          replace_once('EmuFramework/src/EmuVideoLayer.cc', 'viewRect.x + viewRect.xSize() * 832 / 1000', 'viewRect.x + viewRect.xSize() * 785 / 1000')
          controls = 'EmuFramework/src/gui/PlaceVControlsView.cc'
          replace_once(controls, 'exitText{attach.rendererTask, "Exit", &defaultFace()}', 'exitText{attach.rendererTask, "Save & Exit", &defaultFace()}')
          replace_once(controls, '\t\t\t\t\tif(d.elem)\n\t\t\t\t\t\treturn;', '\t\t\t\t\tif(d.elem)\n\t\t\t\t\t{\n\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}')
          replace_once(controls, '\t\t\t\t\t{\n\t\t\t\t\t\tdismiss();\n\t\t\t\t\t}\n\t\t\t\t\telse if(snapBtnRect.overlaps', '\t\t\t\t\t{\n\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t\tdismiss();\n\t\t\t\t\t}\n\t\t\t\t\telse if(snapBtnRect.overlaps')

          video = 'EmuFramework/src/gui/PlaceVideoView.cc'
          replace_once(video, 'exitText{attach.rendererTask, "Exit", &defaultFace()}', 'exitText{attach.rendererTask, "Save & Exit", &defaultFace()}')
          replace_once(video, '\t\t\t\t\t\tdragState = {};\n\t\t\t\t\t}', '\t\t\t\t\t\tdragState = {};\n\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t}')
          replace_once(video, '\t\t\t\t\t\t{\n\t\t\t\t\t\t\tdismiss();\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if(resetBounds.overlaps', '\t\t\t\t\t\t{\n\t\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t\t\tdismiss();\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if(resetBounds.overlaps')

          # Enregistre immediatement le dossier des ROMs selectionne.
          replace_optional('EmuFramework/src/EmuApp.cc', '\t\tsetContentSearchPath(path);\n\t\tviewController().pushAndShow(', '\t\tsetContentSearchPath(path);\n\t\tsaveConfigFile(appContext());\n\t\tviewController().pushAndShow(')
          replace_optional('EmuFramework/src/EmuApp.cc', '\t\t\trecentContent.add(system());\n\t\t\tlaunchSystem(e);', '\t\t\trecentContent.add(system());\n\t\t\tsetContentSearchPath(FS::dirnameUri(system().contentLocation()));\n\t\t\tsaveConfigFile(appContext());\n\t\t\tlaunchSystem(e);')

          # Au demarrage, la configuration est d'abord lue avant la creation
          # complete des commandes tactiles. La V10 la recharge apres configure()
          # afin que les positions, tailles, rectangle video et dossier ROM
          # sauvegardes remplacent definitivement les valeurs par defaut.
          replace_once('EmuFramework/src/EmuApp.cc',
              '\t\t\tvController.configure(win, renderer, viewManager.defaultFace);\n\t\t\tif(EmuSystem::inputHasKeyboard)',
              '\t\t\tvController.configure(win, renderer, viewManager.defaultFace);\n\t\t\tloadConfigFile(ctx);\n\t\t\tvController.configure(win, renderer, viewManager.defaultFace);\n\t\t\tif(EmuSystem::inputHasKeyboard)')

          # Sauvegarde immédiate pendant les déplacements, même si Android ferme
          # l'application sans laisser le temps à l'écran de configuration de se fermer.
          replace_optional(controls,
              '\t\t\t\t\t\t\tpostDraw();\n\t\t\t\t\t\t\treturn;',
              '\t\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t\t\tpostDraw();\n\t\t\t\t\t\t\treturn;')
          replace_optional(controls,
              '\t\t\t\t\t\tapp().viewController().placeEmuViews();\n\t\t\t\t\t\tpostDraw();',
              '\t\t\t\t\t\tapp().viewController().placeEmuViews();\n\t\t\t\t\t\tapp().saveConfigFile(appContext());\n\t\t\t\t\t\tpostDraw();')
          replace_optional(video,
              '\t\t\t\t\t\tapp().viewController().postDrawToEmuWindows();',
              '\t\t\t\t\t\tapp().viewController().postDrawToEmuWindows();\n\t\t\t\t\t\tapp().saveConfigFile(appContext());')

          # Nouvelle clé V3 : elle évite de relire les anciennes données de disposition
          # V2 qui ne contenaient pas la taille individuelle de chaque touche.
          replace_optional('EmuFramework/include/emuframework/EmuOptions.hh',
              '\tCFGKEY_VIDEO_PORTRAIT_W = 127, CFGKEY_VIDEO_PORTRAIT_H = 128,',
              '\tCFGKEY_VIDEO_PORTRAIT_W = 127, CFGKEY_VIDEO_PORTRAIT_H = 128,\n\tCFGKEY_VCONTROLLER_DEVICE_BUTTONS_V3 = 129, CFGKEY_VCONTROLLER_UI_BUTTONS_V3 = 130,')
          controller_source = Path('EmuFramework/src/vcontrols/VController.cc')
          controller_text = controller_source.read_text()
          controller_text = controller_text.replace('CFGKEY_VCONTROLLER_DEVICE_BUTTONS_V2', 'CFGKEY_VCONTROLLER_DEVICE_BUTTONS_V3')
          controller_text = controller_text.replace('CFGKEY_VCONTROLLER_UI_BUTTONS_V2', 'CFGKEY_VCONTROLLER_UI_BUTTONS_V3')
          controller_source.write_text(controller_text)

          metadata = 'Snes9x/metadata/conf.mk'
          for old, new in [('SNES Pad V6', 'SNES Pad V10'), ('com.rlbtplomberie.snespadv6', 'com.rlbtplomberie.snespadv10'), ('snespadv6', 'snespadv10'), ('SNESPadV6', 'SNESPadV10')]:
              replace_once(metadata, old, new)
          print('Corrections V10 appliquees apres la base V6')
          PY
          sed -i '/#include <imagine\/gui\/View.hh>/a #include <imagine/gfx/Quads.hh>' EmuFramework/include/emuframework/EmuInputView.hh
          sed -i 's/constexpr uint8_t defaultAlpha = 255. \* .5;/constexpr uint8_t defaultAlpha = 255. * .92;/' EmuFramework/src/vcontrols/VController.cc
          sed -i 's/multiplyRGB(.70f)/multiplyRGB(.48f)/g; s/multiplyRGB(1.28f)/multiplyRGB(1.62f)/g' EmuFramework/src/vcontrols/VControllerDPad.cc
          cp /tmp/snes-v2-assets/gpOverlay.png Snes9x/res/overlays/gpOverlay.png
          cp /tmp/snes-v2-assets/snesPadPortrait.png Snes9x/res/android/assets/snesPadPortrait.png
          cp /tmp/snes-v2-assets/snesPadLandscape.png Snes9x/res/android/assets/snesPadLandscape.png

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Install V10 horizontal background and logo
        working-directory: source
        env:
          V10_LANDSCAPE_B64: 
        run: |
          printf '%s' "$V10_LANDSCAPE_B64" | base64 -d > /tmp/snes-v8-landscape.jpg
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter

          RESAMPLE = getattr(Image, 'Resampling', Image)
          assets = Path('/tmp/snes-v2-assets')

          def erase_edge_checker(image):
              image = image.convert('RGBA')
              px = image.load()
              width, height = image.size
              seen = bytearray(width * height)
              queue = deque()
              def is_checker(x, y):
                  r, g, b, _ = px[x, y]
                  return min(r, g, b) >= 218 and max(r, g, b) - min(r, g, b) <= 12
              def add(x, y):
                  idx = y * width + x
                  if not seen[idx] and is_checker(x, y):
                      seen[idx] = 1
                      queue.append((x, y))
              for x in range(width): add(x, 0); add(x, height - 1)
              for y in range(height): add(0, y); add(width - 1, y)
              while queue:
                  x, y = queue.popleft()
                  if x: add(x - 1, y)
                  if x + 1 < width: add(x + 1, y)
                  if y: add(x, y - 1)
                  if y + 1 < height: add(x, y + 1)
              for y in range(height):
                  for x in range(width):
                      if seen[y * width + x]: px[x, y] = (198, 196, 193, 255)
              return image

          # Reproduit strictement le portrait V7 : aucun changement visuel en V10.
          portrait = Image.open(assets / 'snesPadPortrait.png').convert('RGBA').crop((60, 18, 963, 1537))
          portrait = erase_edge_checker(portrait)
          circle = portrait.crop((510, 945, 895, 1340)).resize((385, 292), RESAMPLE.LANCZOS)
          metal = portrait.crop((100, 850, 495, 1050)).resize((395, 405), RESAMPLE.LANCZOS)
          erase_circle = Image.new('L', (395, 405), 0)
          ImageDraw.Draw(erase_circle).ellipse((0, 0, 394, 404), fill=255)
          erase_circle = erase_circle.filter(ImageFilter.GaussianBlur(8))
          portrait.paste(metal, (505, 940), erase_circle)
          round_mask = Image.new('L', (385, 292), 0)
          ImageDraw.Draw(round_mask).ellipse((2, 2, 382, 289), fill=255)
          round_mask = round_mask.filter(ImageFilter.GaussianBlur(1))
          portrait.paste(circle, (510, 997), round_mask)
          portrait_alpha = Image.new('L', portrait.size, 255)
          ImageDraw.Draw(portrait_alpha).rounded_rectangle((26, 30, 877, 831), radius=28, fill=0)
          portrait.putalpha(portrait_alpha)
          portrait.save('Snes9x/res/android/assets/snesPadPortrait.png', optimize=True)

          # Nouveau fond horizontal sans boutons. La fenetre noire devient transparente
          # pour laisser apparaitre le jeu, et la coque couvre tout l'ecran sans damier.
          landscape = Image.open('/tmp/snes-v8-landscape.jpg').convert('RGBA')
          landscape = landscape.resize((1847, 851), RESAMPLE.LANCZOS)
          alpha = Image.new('L', landscape.size, 255)
          ImageDraw.Draw(alpha).rounded_rectangle((407, 61, 1438, 699), radius=18, fill=0)
          landscape.putalpha(alpha)
          landscape.save('Snes9x/res/android/assets/snesPadLandscape.png', optimize=True)

          ui_path = Path('Snes9x/res/android/assets/ui.png')
          ui = Image.open(ui_path).convert('RGBA')
          draw = ImageDraw.Draw(ui)
          draw.rounded_rectangle((3, 72, 61, 120), radius=12, fill=(83, 34, 150, 255), outline=(165, 116, 230, 255), width=3)
          draw.polygon([(18, 84), (18, 108), (31, 96)], fill='white')
          draw.polygon([(33, 84), (33, 108), (46, 96)], fill='white')
          ui.save(ui_path, optimize=True)

          logo = Image.open(assets / 'app-logo.png').convert('RGB')
          for path in Path('Snes9x/res/icons').glob('icon-*.png'):
              try:
                  size = int(path.stem.split('-')[1])
                  logo.resize((size, size), RESAMPLE.LANCZOS).save(path, 'PNG')
              except Exception as error:
                  print(f'Logo ignore pour {path}: {error}')
          PY

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake autopoint bash binutils-arm-linux-gnueabi clang cmake file gawk gettext git libtool libtool-bin llvm make nasm pkg-config python3-pil unzip wget

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android NDK r26c
        working-directory: source
        run: |
          mkdir -p imagine-sdk
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          {
            echo "ANDROID_NDK_PATH=$PWD/android-ndk-r26c"
            echo "EMUFRAMEWORK_PATH=$PWD/EmuFramework"
            echo "IMAGINE_PATH=$PWD/imagine"
            echo "IMAGINE_SDK_PATH=$PWD/imagine-sdk"
          } >> "$GITHUB_ENV"

      - name: Build libraries
        working-directory: source/imagine/bundle/all
        run: |
          chmod +x ./makeAll-android.sh
          ./makeAll-android.sh install

      - name: Build framework
        working-directory: source
        run: |
          set -o pipefail
          make -f "$IMAGINE_PATH/android-release.mk" install V=1 -j2 2>&1 | tee /tmp/imagine-build.log
          make -f "$EMUFRAMEWORK_PATH/android-release.mk" config -j1 2>&1 | tee /tmp/framework-config.log
          make -f "$EMUFRAMEWORK_PATH/android-release.mk" install V=1 -j2 2>&1 | tee /tmp/framework-build.log

      - name: Show framework error details
        if: failure()
        run: |
          tail -n 120 /tmp/imagine-build.log 2>/dev/null || true
          tail -n 120 /tmp/framework-config.log 2>/dev/null || true
          tail -n 160 /tmp/framework-build.log 2>/dev/null || true

      - name: Build APK
        working-directory: source/Snes9x
        run: |
          make -f android-release.mk android-apk V=1 -j2
          cp target/android-release/build/outputs/apk/release/SNESPadV10-release.apk "$GITHUB_WORKSPACE/SNES-Pad-V10.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SNES-Pad-V10
          path: SNES-Pad-V10.apk

      - name: Publish V10 release
        uses: ncipollo/release-action@v1
        with:
          tag: snes-pad-v10
          name: SNES Pad V10
          artifacts: SNES-Pad-V10.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
