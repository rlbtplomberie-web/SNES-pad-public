name: Build SNES Pad V1 Fix 2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get emulator source
        run: |
          wget -q "https://raw.githubusercontent.com/rlbtplomberie-web/SNES-pad-public/53e48961ddaae341c5e8b26e6c41ddc7c562560d/.github/workflows/build-snes-pad-v1.yml" -O /tmp/v1-data.yml
          extract_block() {
            awk -v start="$1" -v stop="$2" '
              index($0, start) { active=1; next }
              active && $0 ~ "^[[:space:]]*" stop "$" { exit }
              active { gsub(/[[:space:]]/, ""); print }
            ' /tmp/v1-data.yml | base64 --decode > "$3"
          }
          mkdir -p /tmp/snes-assets
          extract_block "<<'PATCH64'" PATCH64 /tmp/snes-v1.patch
          extract_block "<<'PAD64'" PAD64 /tmp/snes-assets/gpOverlay.png
          extract_block "<<'PORTRAIT64'" PORTRAIT64 /tmp/snes-assets/snesPadPortrait.png
          extract_block "<<'LANDSCAPE64'" LANDSCAPE64 /tmp/snes-assets/snesPadLandscape.png
          extract_block "<<'LOGO64'" LOGO64 /tmp/snes-assets/snes-logo.png

          git clone https://github.com/Rakashazi/emu-ex-plus-alpha.git source
          cd source
          git checkout 1c12fac5ce49badaadff2e2f210dcc30b89f4943
          git apply /tmp/snes-v1.patch
          cp /tmp/snes-assets/gpOverlay.png Snes9x/res/overlays/gpOverlay.png
          cp /tmp/snes-assets/snesPadPortrait.png Snes9x/res/android/assets/snesPadPortrait.png
          cp /tmp/snes-assets/snesPadLandscape.png Snes9x/res/android/assets/snesPadLandscape.png

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake autopoint bash file gawk gcc-arm-linux-gnueabi gettext git libtool libtool-bin make nasm pkg-config python3-pil unzip wget

      - uses: lukka/get-cmake@latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app logo
        run: |
          cd source
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          logo = Image.open('/tmp/snes-assets/snes-logo.png').convert('RGB')
          icons = Path('Snes9x/res/icons')
          for path in icons.glob('icon-*.png'):
              size = int(path.stem.split('-')[1])
              logo.resize((size, size), Image.Resampling.LANCZOS).save(path)
          for path in icons.glob('adaptive-icon-fg-*.webp'):
              size = int(path.stem.split('-')[-1])
              logo.resize((size, size), Image.Resampling.LANCZOS).save(path, 'WEBP', lossless=True)
          Image.new('RGB', (1, 1), 'black').save(icons / 'adaptive-icon-bg.webp', 'WEBP', lossless=True)
          logo.resize((732, 412), Image.Resampling.LANCZOS).save(icons / 'tv-banner.webp', 'WEBP', lossless=True)
          PY

      - name: Set up Android build
        working-directory: source
        run: |
          mkdir imagine-sdk
          wget -q https://dl.google.com/android/repository/android-ndk-r30-beta1-linux.zip
          unzip -q android-ndk-r30-beta1-linux.zip
          mv android-ndk-r30-beta1 android-ndk
          {
            echo "ANDROID_NDK_PATH=$PWD/android-ndk"
            echo "EMUFRAMEWORK_PATH=$PWD/EmuFramework"
            echo "IMAGINE_PATH=$PWD/imagine"
            echo "IMAGINE_SDK_PATH=$PWD/imagine-sdk"
          } >> "$GITHUB_ENV"

      - name: Build framework
        working-directory: source
        run: |
          cd imagine/bundle/all
          ./makeAll-android.sh install
          cd ../../..
          "$IMAGINE_PATH/android.sh" config
          "$IMAGINE_PATH/android.sh" install --config Release
          "$EMUFRAMEWORK_PATH/android.sh" config
          "$EMUFRAMEWORK_PATH/android.sh" install --config Release

      - name: Build APK
        working-directory: source/Snes9x
        run: |
          make -f android.mk android-apk CONFIG=Release V=1 -j"$(nproc)"
          cp build/android/build/outputs/apk/release/SNESPad-release.apk "$GITHUB_WORKSPACE/SNES-Pad-V1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SNES-Pad-V1
          path: SNES-Pad-V1.apk

      - name: Publish V1 release
        uses: ncipollo/release-action@v1
        with:
          tag: snes-pad-v1
          name: SNES Pad V1
          artifacts: SNES-Pad-V1.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
